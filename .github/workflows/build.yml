name: Build debug APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.6.0

      # compileSdk 37 may not be preinstalled on the runner; accepting licences lets Gradle download it.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: wakeup-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Keeps one always-current download on the Releases page.
      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Wake-Up.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Wake-Up.apk \
            --title "Wake Up (latest build)" \
            --notes "Built from commit ${GITHUB_SHA::7}. Download **Wake-Up.apk**, open it on your phone and tap Install. New builds install over old ones and keep your alarms." \
            --latest
